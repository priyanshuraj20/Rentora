name: Keep Render Backend Alive (6-Hour On-Demand)

on:
  workflow_dispatch: # Trigger manually from GitHub Actions UI when starting interview/study session
  schedule:
    # Runs during peak interview hours only: 12:00 PM to 6:00 PM IST (06:30 - 12:30 UTC)
    - cron: '*/14 6-12 * * *'

jobs:
  keep-alive-session:
    runs-on: ubuntu-latest
    steps:
      - name: Keep Render Awake for 6 Hours
        run: |
          echo "Starting 6-hour keep-alive session at $(date)..."
          # 36 iterations x 10 minutes = 360 minutes (6 hours)
          for i in {1..36}
          do
            echo "Ping $i/36 at $(date)"
            curl -s -o /dev/null -w "HTTP Status: %{http_code}\n" https://rentora-tgf9.onrender.com/health || true
            sleep 600
          done
          echo "6-hour session complete. Server will now sleep to preserve monthly Render quota."
